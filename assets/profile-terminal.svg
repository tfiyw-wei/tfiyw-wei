<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">tfiyw-wei · AI 产品探索与交互原型</title>
  <desc id="desc">从产品想法到交互原型，再到可体验的作品。项目包括 eleme-motion-landing-page 和 personal-website。</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#f2f7fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2477b8"/>
      <stop offset="1" stop-color="#149b9c"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .ink { fill: #20384e; }
      .muted { fill: #63798c; }
      .blue { fill: #2477b8; }
      .teal { fill: #13898c; }
      .arrival { animation: settle .65s ease-out both; }
      .cursor { animation: pulse 1.8s ease-in-out infinite; }
      @keyframes settle {
        from { transform: translateY(3px); }
        to { transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .35; }
      }
      @media (prefers-reduced-motion: reduce) {
        .arrival, .cursor { animation: none; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="338" rx="18" fill="url(#surface)" stroke="#d7e3ed" stroke-width="2"/>
  <path d="M19 2h922a17 17 0 0 1 17 17v27H2V19A17 17 0 0 1 19 2Z" fill="#edf3f8"/>
