  <rect x="867" y="17" width="62" height="15" rx="7.5" fill="#e2efee"/>
  <circle cx="878" cy="24.5" r="2.5" fill="#13898c"/>
  <text x="887" y="28.5" class="mono teal" font-size="10">OPEN</text>

