    <text x="42" y="129" class="sans ink" font-size="30" font-weight="650">AI 产品探索<tspan fill="#9bb2c4"> · </tspan>交互原型</text>
    <rect x="450" y="105" width="3" height="27" rx="1.5" fill="url(#accent)" class="cursor"/>

